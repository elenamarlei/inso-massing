<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ИНСО — грани к солнцу 2, квартал</title>
<style>
  body { margin: 0; background: #dcdfe3; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #ui { position: fixed; top: 12px; left: 12px; background: rgba(255,255,255,.93); padding: 10px 12px; border-radius: 8px; max-width: 340px; max-height: calc(100vh - 44px); overflow: auto; }
  #ui h1 { font-size: 15px; margin: 0 0 8px; }
  #ui button { margin: 0 4px 6px 0; padding: 4px 8px; border: 1px solid #9aa3ad; background: #fff; border-radius: 4px; cursor: pointer; }
  #ui button.on { background: #2b3a4a; color: #fff; border-color: #2b3a4a; }

  #ui input[type=range] { width: 100%; }
  #info { color: #555; font-size: 12px; margin-top: 6px; }
  body.clean #ui { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <h1>ИНСО — грани к солнцу, вариант 2: крупные грани, подиум по улице, двор сбоку, край парка в городе</h1>
  <div>
    <button data-view="park">Из парка</button>
    <button data-view="street">С тротуара у парка</button>
    <button data-view="yard">Двор</button>
    <button data-view="corner">Срезанный угол</button>
    <button data-view="crown">Верх</button>
    <button data-view="far">Издалека</button>
    <button data-view="quarter">Квартал</button>
    <button data-view="top">План сверху</button>
  </div>
  <label>Вынос граней: <span id="foldLabel"></span><input type="range" id="fold" min="0" max="6" step="0.1"></label>
  <label>Ширина грани: <span id="cwLabel"></span><input type="range" id="cw" min="2" max="6" step="1"></label>
  <label>Высота грани: <span id="chLabel"></span><input type="range" id="ch" min="3" max="10" step="1"></label>
  <label><input type="checkbox" id="ends"> Торцы тоже гранями</label>
  <label><input type="checkbox" id="street"> Подиум по улице, башня повёрнута на нём</label>
  <label><input type="checkbox" id="nb"> Соседние дома</label>
  <label><input type="checkbox" id="labels"> Этажность</label>
  <label><input type="checkbox" id="evening"> Вечер: подсветка верха, подиум, горящие окна</label>
  <label><input type="checkbox" id="sun"> Солнце (55° с. ш.) <select id="date"></select></label>
  <label>Время (солнечное): <span id="tLabel"></span><input type="range" id="tSlider" step="0.25"></label>
  <div id="info"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const V2 = THREE.Vector2;

// ---- Параметры (метры); x — восток, z — юг ----
const ROT = 20, LEN = 40, DEPTH = 16, CUT = 4.0, MODULE = 3.4;
const FLOORS = 40, TOP_GLOW = 2, FLOOR_H = 3.3, PODIUM_H = 9;
const MAIN = FLOORS - TOP_GLOW;             // 38 жилых этажей с рамами; сверху пояс подсветки верха ≈ 6,6 м — не этажи и не помещения
const LAT = 55, rad = Math.PI / 180;
const DATES = { nov: { decl: -18.6, name: '15 ноября' }, mar: { decl: 0, name: '21 марта' }, jun: { decl: 23.44, name: '21 июня' } };
// Рамы: внизу на 3 этажа × 2 окна, в середине 2 × 2, наверху 1 × 1
const ZONES = [
  { from: 0,  count: 12, floors: 3, mods: 2, vw: 0.8, hh: 0.6 },
  { from: 12, count: 12, floors: 2, mods: 2, vw: 0.6, hh: 0.5 },
  { from: 24, count: 14, floors: 1, mods: 1, vw: 0.4, hh: 0.35 },
];

const params = new URLSearchParams(location.search);
if (params.get('clean')) document.body.classList.add('clean');
const flag = (k, d) => params.has(k) ? params.get(k) === '1' : d;
const opt = {
  fold: +(params.get('fold') ?? 4), cw: +(params.get('cw') ?? 4), ch: +(params.get('ch') ?? 6),
  ends: flag('ends', true), street: flag('street', true), nb: flag('nb', true), labels: flag('labels', false),
  evening: flag('evening', false), sun: flag('sun', false), date: params.get('date') || 'nov',
};

// ---- План башни: параллелограмм, торцы по линии север–юг, острые углы срезаны ----
const dirS = new V2(Math.cos(ROT * rad), -Math.sin(ROT * rad));
const nS = new V2(Math.sin(ROT * rad), Math.cos(ROT * rad));
const nCut = new V2(-Math.sin(30 * rad), Math.cos(30 * rad));
const Z0 = 9;
function makePlan() {
  const DZ = DEPTH / Math.cos(ROT * rad), c = new V2(0, Z0);
  const A = c.clone().add(dirS.clone().multiplyScalar(-LEN / 2)), B = c.clone().add(dirS.clone().multiplyScalar(LEN / 2));
  const A2 = new V2(A.x, A.y - DZ), B2 = new V2(B.x, B.y - DZ);
  const dCut = CUT * (Math.sin(ROT * rad) + Math.cos(ROT * rad) * Math.tan(30 * rad));
  const P1 = A.clone().add(dirS.clone().multiplyScalar(CUT)), P2 = new V2(A.x, A.y - dCut);
  const Q1 = new V2(B2.x, B2.y + dCut), Q2 = B2.clone().add(dirS.clone().multiplyScalar(-CUT));
  return [P1, B, Q1, Q2, A2, P2];
}
const PLAN = makePlan();
const WALLS = [ // [от, до, нормаль, тип] по индексам точек плана
  [5, 0, nCut, 'cut'], [0, 1, nS, 'south'], [1, 2, new V2(1, 0), 'eastEnd'],
  [2, 3, new V2(-nCut.x, -nCut.y), 'service'], [3, 4, nS.clone().negate(), 'north'], [4, 5, new V2(-1, 0), 'westEnd'],
];
// Подиум по улице: прямоугольник по сетке улиц вокруг повёрнутой башни (к парку 9 м, по бокам 5 м, к северу 2 м)
const R = (() => { const xs = PLAN.map(p => p.x), zs = PLAN.map(p => p.y); return { x0: Math.min(...xs) - 5, x1: Math.max(...xs) + 5, z0: Math.min(...zs) - 2, z1: Math.max(...zs) + 9 }; })();
// Участок: с юга подиум → тротуар с деревьями и кустами → дорога → парк; с запада двор; с севера вход, улица, город
const S = {};
S.walkS = R.z1 + 10; S.roadS = S.walkS + 12; S.park = S.roadS + 5;
S.plazaN = R.z0 - 8; S.roadN = S.plazaN - 12; S.walkN = S.roadN - 6; S.city = S.walkN - 25;
S.yard0 = R.x0 - 60; S.roadW = S.yard0 - 12; S.cityW = S.roadW - 6;
S.roadE0 = R.x1 + 6; S.roadE1 = S.roadE0 + 12; S.cityE = R.x1 + 55;
const Y = { x0: S.yard0, x1: R.x0, z0: S.plazaN + 4, z1: R.z1 };

// ---- Рендер ----
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.5, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
const hemi = new THREE.HemisphereLight(0xffffff, 0xb8bcc0, 1.1); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -330, right: 330, top: 330, bottom: -330, near: 1, far: 1600 });
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.05;
scene.add(sun, sun.target);
const mat = o => new THREE.MeshStandardMaterial({ roughness: 0.8, ...o });
const warm = 0xffb768;

// ---- Текстуры ----
const PX = 24;
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function canvas(len, h, px = PX) { const c = document.createElement('canvas'); c.width = Math.max(8, Math.round(len * px)); c.height = Math.max(8, Math.round(h * px)); return c; }
function toTex(c) { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
// стекло за рамами: окна от m0 на mods шагов, остальное — светлая стена; вечером часть ячеек светится
function glassMaps(len, floors, m0, mods, ev, oneStep) {
  const col = canvas(len, floors * FLOOR_H), emi = canvas(len, floors * FLOOR_H), g = col.getContext('2d'), e = emi.getContext('2d');
  const H = col.height, y = m => H - m * PX, xe = (m0 + mods * MODULE) * PX;
  g.fillStyle = ev ? '#26303d' : '#8e98a1'; g.fillRect(0, 0, col.width, H); e.fillStyle = '#000'; e.fillRect(0, 0, emi.width, H);
  g.fillStyle = '#e8e2d7'; g.fillRect(0, 0, m0 * PX, H); g.fillRect(xe, 0, col.width - xe, H);
  for (let f = 0; f < floors; f++) for (let k = 0; k < mods; k++) {
    if (ev && rnd() < 0.3) { const x = (m0 + k * MODULE) * PX, t = y((f + 1) * FLOOR_H), b = y(f * FLOOR_H); g.fillStyle = '#f2cf96'; g.fillRect(x, t, MODULE * PX, b - t); e.fillStyle = '#8a6233'; e.fillRect(x, t, MODULE * PX, b - t); }
  }
  g.strokeStyle = '#2f3338';
  for (let k = 0; k <= mods; k++) { const x = (m0 + k * MODULE) * PX; g.lineWidth = 2; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let k = 0; k < mods; k++) { const x = (m0 + k * MODULE + MODULE * 0.72) * PX; g.lineWidth = 1; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let f = 0; f <= floors; f++) { g.fillStyle = '#c9c4bb'; g.fillRect(m0 * PX, y(f * FLOOR_H) - 0.12 * PX, mods * MODULE * PX, 0.24 * PX); }
  g.fillStyle = '#efe9de'; e.fillStyle = '#000'; // рамы светлой керамики
  for (const z of ZONES) {
    const f0 = z.from, f1 = Math.min(z.from + z.count, floors); if (f1 <= f0) continue;
    const mpf = oneStep ? 1 : z.mods, yb = y(f0 * FLOOR_H), yt = y(f1 * FLOOR_H);
    for (let k = 0; k <= mods; k += mpf) { const x = (m0 + k * MODULE - z.vw / 2) * PX; g.fillRect(x, yt, z.vw * PX, yb - yt); e.fillRect(x, yt, z.vw * PX, yb - yt); }
    for (let f = f0; f <= f1; f += z.floors) { const yy = y(f * FLOOR_H); g.fillRect((m0 - z.vw / 2) * PX, yy - z.hh / 2 * PX, (mods * MODULE + z.vw) * PX, z.hh * PX); e.fillRect((m0 - z.vw / 2) * PX, yy - z.hh / 2 * PX, (mods * MODULE + z.vw) * PX, z.hh * PX); }
  }
  return { map: toTex(col), emissiveMap: toTex(emi) };
}
// бетонные стены с окнами (север, торцы без граней)
function wallMaps(len, floors, windows, ev) {
  const col = canvas(len, floors * FLOOR_H), emi = canvas(len, floors * FLOOR_H), g = col.getContext('2d'), e = emi.getContext('2d');
  const H = col.height, y = m => H - m * PX;
  g.fillStyle = '#e8e2d7'; g.fillRect(0, 0, col.width, H); e.fillStyle = '#000'; e.fillRect(0, 0, emi.width, H);
  for (let f = 0; f < floors; f++) for (const [x0, w] of windows) {
    const t = y((f + 1) * FLOOR_H - 0.05), b = y(f * FLOOR_H + 0.4), lit = ev && rnd() < 0.3;
    g.fillStyle = lit ? '#f2cf96' : (ev ? '#26303d' : '#8e98a1'); g.fillRect(x0 * PX, t, w * PX, b - t);
    if (lit) { e.fillStyle = '#8a6233'; e.fillRect(x0 * PX, t, w * PX, b - t); }
    g.strokeStyle = '#2f3338'; g.lineWidth = 2; g.strokeRect(x0 * PX, t, w * PX, b - t);
  }
  return { map: toTex(col), emissiveMap: toTex(emi) };
}
function topGlowMaps(len, ev) {
  const col = canvas(len, TOP_GLOW * FLOOR_H), emi = canvas(len, TOP_GLOW * FLOOR_H), g = col.getContext('2d'), e = emi.getContext('2d');
  g.fillStyle = ev ? '#f4dcb0' : '#9aa8b4'; g.fillRect(0, 0, col.width, col.height);
  e.fillStyle = ev ? '#9c7442' : '#000'; e.fillRect(0, 0, emi.width, emi.height);
  g.strokeStyle = '#2f3338'; g.lineWidth = 2;
  for (let x = 0; x <= len; x += 1.5) { g.beginPath(); g.moveTo(x * PX, 0); g.lineTo(x * PX, col.height); g.stroke(); }
  g.beginPath(); g.moveTo(0, col.height / 2); g.lineTo(col.width, col.height / 2); g.stroke();
  return { map: toTex(col), emissiveMap: toTex(emi) };
}
// соседние дома: только силуэт и ритм окон, без деталей
const NPX = 5, NFLOOR = 3.1;
function blockMaps(len, floors, office, ev) {
  const col = canvas(len, floors * NFLOOR, NPX), emi = canvas(len, floors * NFLOOR, NPX), g = col.getContext('2d'), e = emi.getContext('2d');
  const H = col.height, y = m => H - m * NPX;
  g.fillStyle = office ? '#cfd0cf' : '#d6d0c7'; g.fillRect(0, 0, col.width, H); e.fillStyle = '#000'; e.fillRect(0, 0, emi.width, H);
  for (let f = 0; f < floors; f++) {
    const step = office ? 1.6 : 3.2, w = office ? 1.5 : 1.6, h = office ? 2.0 : 1.6, sill = office ? 0.6 : 0.9;
    for (let x = 1; x + w < len - 0.5; x += step) {
      const lit = ev && rnd() < (office ? 0.15 : 0.35);
      g.fillStyle = lit ? '#e9c58f' : (ev ? '#2a313a' : '#8f979d'); g.fillRect(x * NPX, y(f * NFLOOR + sill + h), w * NPX, h * NPX);
      if (lit) { e.fillStyle = '#6e5130'; e.fillRect(x * NPX, y(f * NFLOOR + sill + h), w * NPX, h * NPX); }
    }
  }
  return { map: toTex(col), emissiveMap: toTex(emi) };
}

// ---- Геометрия ----
function wall(p1, p2, y0, y1, out, material) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute([p1.x, y0, p1.y, p2.x, y0, p2.y, p2.x, y1, p2.y, p1.x, y1, p1.y], 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 1, 0, 1, 1, 0, 1], 2));
  const n = new THREE.Vector3(out.x, 0, out.y).normalize();
  const cross = new THREE.Vector3(p2.x - p1.x, 0, p2.y - p1.y).cross(new THREE.Vector3(0, 1, 0));
  geo.setIndex(cross.dot(n) > 0 ? [0, 1, 2, 0, 2, 3] : [0, 2, 1, 0, 3, 2]);
  geo.setAttribute('normal', new THREE.Float32BufferAttribute([...n.toArray(), ...n.toArray(), ...n.toArray(), ...n.toArray()], 3));
  const m = new THREE.Mesh(geo, material); m.castShadow = m.receiveShadow = true; return m;
}
// грани: узлы сетки (cellLen × cellFloors) в шахматном порядке вынесены вперёд на depth, ячейки разломаны по диагонали — ромбы; края фасада в плоскости
function facets(a, b, y0, y1, out, material, floors, cellLen, cellFloors, depth) {
  const len = a.distanceTo(b), dir = new V2().subVectors(b, a).normalize(), n = new V2(out.x, out.y).normalize();
  const N = Math.max(2, Math.round(len / cellLen)), M = Math.max(2, Math.round(floors / cellFloors)), H = y1 - y0;
  const node = (k, m) => { const raised = (k + m) % 2 === 1 && k > 0 && k < N && m > 0 && m < M; const sx = len * k / N, yy = y0 + H * m / M; const p = a.clone().add(dir.clone().multiplyScalar(sx)).add(n.clone().multiplyScalar(raised ? depth : 0)); return { v: [p.x, yy, p.y], uv: [sx / len, (yy - y0) / H] }; };
  const pos = [], uv = [], tri = (p, q, r) => { for (const t of [p, q, r]) { pos.push(...t.v); uv.push(...t.uv); } };
  for (let k = 0; k < N; k++) for (let m = 0; m < M; m++) {
    const c00 = node(k, m), c10 = node(k + 1, m), c01 = node(k, m + 1), c11 = node(k + 1, m + 1);
    if ((k + m) % 2 === 1) { tri(c00, c10, c11); tri(c00, c11, c01); } else { tri(c00, c10, c01); tri(c10, c11, c01); }
  }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); geo.computeVertexNormals();
  const nr = geo.getAttribute('normal'); let dot = 0; for (let k = 0; k < nr.count; k++) dot += nr.getX(k) * n.x + nr.getZ(k) * n.y;
  if (dot < 0) { const P = geo.getAttribute('position'), U = geo.getAttribute('uv'); for (let k = 0; k < P.count; k += 3) for (const A of [P, U]) { const t = A.array.slice(A.itemSize * (k + 1), A.itemSize * (k + 2)); A.array.copyWithin(A.itemSize * (k + 1), A.itemSize * (k + 2), A.itemSize * (k + 3)); A.array.set(t, A.itemSize * (k + 2)); } geo.computeVertexNormals(); }
  const mesh = new THREE.Mesh(geo, material); mesh.castShadow = mesh.receiveShadow = true; return mesh;
}
// куда смотрят грани: азимут от юга (+ к востоку) и наклон стекла от вертикали
function facetAngles(mesh) {
  const P = mesh.geometry.getAttribute('position'), a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  let azMin = 999, azMax = -999, tilt = 0;
  for (let k = 0; k < P.count; k += 3) {
    a.fromBufferAttribute(P, k); b.fromBufferAttribute(P, k + 1); c.fromBufferAttribute(P, k + 2);
    const n = b.clone().sub(a).cross(c.clone().sub(a)); if (n.length() < 1e-6) continue; n.normalize();
    const az = Math.atan2(n.x, n.z) / rad; azMin = Math.min(azMin, az); azMax = Math.max(azMax, az); tilt = Math.max(tilt, Math.abs(Math.asin(n.y)) / rad);
  }
  return { azMin, azMax, tilt };
}
function slab(pl, y, thick, material) {
  const shape = new THREE.Shape(pl.map(p => new V2(p.x, -p.y)));
  const geo = new THREE.ExtrudeGeometry(shape, { depth: thick, bevelEnabled: false }); geo.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(geo, material); m.position.y = y; m.castShadow = m.receiveShadow = true; return m;
}
function offsetPlan(pl, d) {
  const L = pl.map((p, i) => { const q = pl[(i + 1) % pl.length], dir = new V2().subVectors(q, p).normalize(); const dd = typeof d === 'function' ? d(i) : d; return { p: p.clone().add(new V2(-dir.y, dir.x).multiplyScalar(dd)), dir }; });
  return pl.map((_, i) => { const l1 = L[(i + pl.length - 1) % pl.length], l2 = L[i]; const t = ((l2.p.x - l1.p.x) * l2.dir.y - (l2.p.y - l1.p.y) * l2.dir.x) / (l1.dir.x * l2.dir.y - l1.dir.y * l2.dir.x); return new V2(l1.p.x + l1.dir.x * t, l1.p.y + l1.dir.y * t); });
}
const rectPlan = (x0, z0, x1, z1) => [new V2(x0, z1), new V2(x1, z1), new V2(x1, z0), new V2(x0, z0)]; // обход как у плана башни
function label(text, x, y, z, parent) {
  const c = document.createElement('canvas'); c.width = 320; c.height = 96; const g = c.getContext('2d');
  g.fillStyle = 'rgba(255,255,255,.85)'; g.fillRect(0, 0, 320, 96); g.fillStyle = '#2b3a4a'; g.font = 'bold 46px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 160, 50);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: toTex(c), depthTest: false })); s.scale.set(26, 7.8, 1); s.position.set(x, y, z); s.renderOrder = 10; parent.add(s);
}

// ---- Башня и подиум ----
let house = new THREE.Group(); scene.add(house);
let southAngles = null;
function build() {
  scene.remove(house); house = new THREE.Group(); seed = 11;
  const ev = opt.evening;
  const ceramic = new THREE.MeshPhysicalMaterial({ color: 0xefe9de, roughness: 0.45, clearcoat: 0.3, clearcoatRoughness: 0.4 });
  const y0 = PODIUM_H, yF = y0 + MAIN * FLOOR_H, yTop = yF + TOP_GLOW * FLOOR_H;
  for (const [i, j, out, type] of WALLS) {
    const a = PLAN[i], b = PLAN[j], len = a.distanceTo(b), isEnd = type === 'eastEnd' || type === 'westEnd';
    if (type === 'south' || type === 'cut' || (isEnd && opt.ends)) {
      let mods, m0;
      if (type === 'south') { mods = Math.floor((len - 1) / MODULE / 2) * 2 || 2; m0 = (len - mods * MODULE) / 2; }
      else if (type === 'cut') { mods = 1; m0 = (len - MODULE) / 2; }

  const v = views[name]; if (!v) return;
  camera.position.set(...v.pos); controls.target.set(...v.target); controls.update();
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === name));
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
setDayBounds();
tSlider.value = params.get('t') || 12;
buildGround();
buildCity();
build();
setView(params.get('view') || 'park');
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
