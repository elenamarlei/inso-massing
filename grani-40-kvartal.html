<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ИНСО — грани к солнцу 2, квартал</title>
<style>
  body { margin: 0; background: #dcdfe3; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #ui { position: fixed; top: 12px; left: 12px; background: rgba(255,255,255,.93); padding: 10px 12px; border-radius: 8px; max-width: 340px; max-height: calc(100vh - 44px); overflow: auto; }
  #ui h1 { font-size: 15px; margin: 0 0 8px; }
  #ui button { margin: 0 4px 6px 0; padding: 4px 8px; border: 1px solid #9aa3ad; background: #fff; border-radius: 4px; cursor: pointer; }
  #ui button.on { background: #2b3a4a; color: #fff; border-color: #2b3a4a; }

  body.clean #ui { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <h1>ИНСО — грани к солнцу, вариант 2: крупные грани, подиум по улице, двор сбоку, край парка в городе</h1>
  <div>
    <button data-view="park">Из парка</button>
    <button data-view="street">С тротуара у парка</button>
    <button data-view="territory">Территория</button>
    <button data-view="west">Запад: пруд</button>
    <button data-view="east">Восток: спорт</button>
    <button data-view="corner">Срезанный угол</button>
    <button data-view="crown">Верх</button>
    <button data-view="far">Издалека</button>
    <button data-view="behind">Город позади</button>
    <button data-view="quarter">Квартал</button>
    <button data-view="top">План сверху</button>
  </div>
  <label>Вынос граней: <span id="foldLabel"></span><input type="range" id="fold" min="0" max="6" step="0.1"></label>
  <label>Ширина грани: <span id="cwLabel"></span><input type="range" id="cw" min="2" max="6" step="1"></label>
  <label>Высота грани: <span id="chLabel"></span><input type="range" id="ch" min="3" max="10" step="1"></label>
  <label><input type="checkbox" id="ends"> Торцы тоже гранями</label>
  <label><input type="checkbox" id="street"> Подиум по улице, башня повёрнута на нём</label>
  <label><input type="checkbox" id="nb"> Город вокруг</label>
  <label><input type="checkbox" id="labels"> Этажность</label>
  <label><input type="checkbox" id="evening"> Вечер: подсветка верха, подиум, горящие окна</label>
  <label><input type="checkbox" id="sun"> Солнце (55° с. ш.) <select id="date"></select></label>
  <label>Время (солнечное): <span id="tLabel"></span><input type="range" id="tSlider" step="0.25"></label>
  <div id="info"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const V2 = THREE.Vector2;

// ---- Параметры (метры); x — восток, z — юг ----
const ROT = 20, LEN = 40, DEPTH = 16, CUT = 4.0, MODULE = 3.4;
const FLOORS = 40, TOP_GLOW = 2, FLOOR_H = 3.3, PODIUM_H = 9;
const MAIN = FLOORS - TOP_GLOW;             // 38 жилых этажей с рамами; сверху пояс подсветки верха ≈ 6,6 м — не этажи и не помещения
const LAT = 55, rad = Math.PI / 180;
const DATES = { nov: { decl: -18.6, name: '15 ноября' }, mar: { decl: 0, name: '21 марта' }, jun: { decl: 23.44, name: '21 июня' } };
// Рамы: внизу на 3 этажа × 2 окна, в середине 2 × 2, наверху 1 × 1
const ZONES = [
  { from: 0,  count: 12, floors: 3, mods: 2, vw: 0.8, hh: 0.6 },
  { from: 12, count: 12, floors: 2, mods: 2, vw: 0.6, hh: 0.5 },
  { from: 24, count: 14, floors: 1, mods: 1, vw: 0.4, hh: 0.35 },
];

const params = new URLSearchParams(location.search);
if (params.get('clean')) document.body.classList.add('clean');
const flag = (k, d) => params.has(k) ? params.get(k) === '1' : d;
const opt = {
  fold: +(params.get('fold') ?? 6), cw: +(params.get('cw') ?? 2), ch: +(params.get('ch') ?? 5),
  ends: flag('ends', true), street: flag('street', true), nb: flag('nb', true), labels: flag('labels', false),
  evening: flag('evening', false), sun: flag('sun', false), date: params.get('date') || 'nov',
};

// ---- План башни: параллелограмм, торцы по линии север–юг, острые углы срезаны ----
const dirS = new V2(Math.cos(ROT * rad), -Math.sin(ROT * rad));
const nS = new V2(Math.sin(ROT * rad), Math.cos(ROT * rad));
const nCut = new V2(-Math.sin(30 * rad), Math.cos(30 * rad));
const Z0 = 9;
function makePlan() {
  const DZ = DEPTH / Math.cos(ROT * rad), c = new V2(0, Z0);
  const A = c.clone().add(dirS.clone().multiplyScalar(-LEN / 2)), B = c.clone().add(dirS.clone().multiplyScalar(LEN / 2));
  const A2 = new V2(A.x, A.y - DZ), B2 = new V2(B.x, B.y - DZ);
  const dCut = CUT * (Math.sin(ROT * rad) + Math.cos(ROT * rad) * Math.tan(30 * rad));
  const P1 = A.clone().add(dirS.clone().multiplyScalar(CUT)), P2 = new V2(A.x, A.y - dCut);
  const Q1 = new V2(B2.x, B2.y + dCut), Q2 = B2.clone().add(dirS.clone().multiplyScalar(-CUT));
  return [P1, B, Q1, Q2, A2, P2];
}
const PLAN = makePlan();
const WALLS = [ // [от, до, нормаль, тип] по индексам точек плана
  [5, 0, nCut, 'cut'], [0, 1, nS, 'south'], [1, 2, new V2(1, 0), 'eastEnd'],
  [2, 3, new V2(-nCut.x, -nCut.y), 'service'], [3, 4, nS.clone().negate(), 'north'], [4, 5, new V2(-1, 0), 'westEnd'],
];
// Подиум по улице: прямоугольник по сетке улиц вокруг повёрнутой башни (к парку 9 м, по бокам 5 м, к северу 2 м)
const R = (() => { const xs = PLAN.map(p => p.x), zs = PLAN.map(p => p.y); return { x0: Math.min(...xs) - 5, x1: Math.max(...xs) + 5, z0: Math.min(...zs) - 2, z1: Math.max(...zs) + 9 }; })();
// Территория дома: по 120 м по бокам от подиума, к северу до улицы (≈ 2,1 га); посередине парадный двор у входа
const T = { x0: R.x0 - 120, x1: R.x1 + 120, z0: R.z0 - 46, z1: R.z1 };
// Участок: с юга подиум → тротуар с деревьями и кустами → дорога → парк; с севера вход, улица, город; по бокам улицы за территорией
const S = {};
S.walkS = R.z1 + 10; S.roadS = S.walkS + 12; S.park = S.roadS + 5;
S.plazaN = T.z0 - 4; S.roadN = S.plazaN - 12; S.walkN = S.roadN - 6; S.city = S.walkN - 25;
S.roadW = T.x0 - 12; S.cityW = S.roadW - 6;
S.roadE0 = T.x1; S.roadE1 = S.roadE0 + 12; S.cityE = S.roadE1 + 6;

// ---- Рендер ----
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.5, 8000);
scene.fog = new THREE.Fog(0xdcdfe3, 900, 3400); // дальний город растворяется в дымке, края не видно
const controls = new OrbitControls(camera, renderer.domElement);
const hemi = new THREE.HemisphereLight(0xffffff, 0xb8bcc0, 1.1); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -330, right: 330, top: 330, bottom: -330, near: 1, far: 1600 });
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.05;
scene.add(sun, sun.target);
const mat = o => new THREE.MeshStandardMaterial({ roughness: 0.8, ...o });
const warm = 0xffb768;

// ---- Текстуры ----
const PX = 24;
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function canvas(len, h, px = PX) { const c = document.createElement('canvas'); c.width = Math.max(8, Math.round(len * px)); c.height = Math.max(8, Math.round(h * px)); return c; }
function toTex(c) { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
// стекло за рамами: окна от m0 на mods шагов, остальное — светлая стена; вечером часть ячеек светится
function glassMaps(len, floors, m0, mods, ev, oneStep) {
  const col = canvas(len, floors * FLOOR_H), emi = canvas(len, floors * FLOOR_H), g = col.getContext('2d'), e = emi.getContext('2d');
  const H = col.height, y = m => H - m * PX, xe = (m0 + mods * MODULE) * PX;
  g.fillStyle = ev ? '#26303d' : '#8e98a1'; g.fillRect(0, 0, col.width, H); e.fillStyle = '#000'; e.fillRect(0, 0, emi.width, H);
  g.fillStyle = '#e8e2d7'; g.fillRect(0, 0, m0 * PX, H); g.fillRect(xe, 0, col.width - xe, H);
  for (let f = 0; f < floors; f++) for (let k = 0; k < mods; k++) {
    if (ev && rnd() < 0.3) { const x = (m0 + k * MODULE) * PX, t = y((f + 1) * FLOOR_H), b = y(f * FLOOR_H); g.fillStyle = '#f2cf96'; g.fillRect(x, t, MODULE * PX, b - t); e.fillStyle = '#8a6233'; e.fillRect(x, t, MODULE * PX, b - t); }
  }
  g.strokeStyle = '#2f3338';
  for (let k = 0; k <= mods; k++) { const x = (m0 + k * MODULE) * PX; g.lineWidth = 2; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let k = 0; k < mods; k++) { const x = (m0 + k * MODULE + MODULE * 0.72) * PX; g.lineWidth = 1; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let f = 0; f <= floors; f++) { g.fillStyle = '#c9c4bb'; g.fillRect(m0 * PX, y(f * FLOOR_H) - 0.12 * PX, mods * MODULE * PX, 0.24 * PX); }
  g.fillStyle = '#efe9de'; e.fillStyle = '#000'; // рамы светлой керамики
  for (const z of ZONES) {
    const f0 = z.from, f1 = Math.min(z.from + z.count, floors); if (f1 <= f0) continue;
    const mpf = oneStep ? 1 : z.mods, yb = y(f0 * FLOOR_H), yt = y(f1 * FLOOR_H);
    for (let k = 0; k <= mods; k += mpf) { const x = (m0 + k * MODULE - z.vw / 2) * PX; g.fillRect(x, yt, z.vw * PX, yb - yt); e.fillRect(x, yt, z.vw * PX, yb - yt); }
    for (let f = f0; f <= f1; f += z.floors) { const yy = y(f * FLOOR_H); g.fillRect((m0 - z.vw / 2) * PX, yy - z.hh / 2 * PX, (mods * MODULE + z.vw) * PX, z.hh * PX); e.fillRect((m0 - z.vw / 2) * PX, yy - z.hh / 2 * PX, (mods * MODULE + z.vw) * PX, z.hh * PX); }
  }
  return { map: toTex(col), emissiveMap: toTex(emi) };
}
// бетонные стены с окнами (север, торцы без граней)
function wallMaps(len, floors, windows, ev) {
  const col = canvas(len, floors * FLOOR_H), emi = canvas(len, floors * FLOOR_H), g = col.getContext('2d'), e = emi.getContext('2d');
  const H = col.height, y = m => H - m * PX;
  g.fillStyle = '#e8e2d7'; g.fillRect(0, 0, col.width, H); e.fillStyle = '#000'; e.fillRect(0, 0, emi.width, H);
  for (let f = 0; f < floors; f++) for (const [x0, w] of windows) {
    const t = y((f + 1) * FLOOR_H - 0.05), b = y(f * FLOOR_H + 0.4), lit = ev && rnd() < 0.3;
    g.fillStyle = lit ? '#f2cf96' : (ev ? '#26303d' : '#8e98a1'); g.fillRect(x0 * PX, t, w * PX, b - t);
    if (lit) { e.fillStyle = '#8a6233'; e.fillRect(x0 * PX, t, w * PX, b - t); }
    g.strokeStyle = '#2f3338'; g.lineWidth = 2; g.strokeRect(x0 * PX, t, w * PX, b - t);
  }
  return { map: toTex(col), emissiveMap: toTex(emi) };
}
function topGlowMaps(len, ev) {
  const col = canvas(len, TOP_GLOW * FLOOR_H), emi = canvas(len, TOP_GLOW * FLOOR_H), g = col.getContext('2d'), e = emi.getContext('2d');
  g.fillStyle = ev ? '#f4dcb0' : '#9aa8b4'; g.fillRect(0, 0, col.width, col.height);
  e.fillStyle = ev ? '#9c7442' : '#000'; e.fillRect(0, 0, emi.width, emi.height);
  g.strokeStyle = '#2f3338'; g.lineWidth = 2;
  for (let x = 0; x <= len; x += 1.5) { g.beginPath(); g.moveTo(x * PX, 0); g.lineTo(x * PX, col.height); g.stroke(); }
  g.beginPath(); g.moveTo(0, col.height / 2); g.lineTo(col.width, col.height / 2); g.stroke();
  return { map: toTex(col), emissiveMap: toTex(emi) };
}
const NFLOOR = 3.1; // этаж соседних домов

// ---- Геометрия ----
function wall(p1, p2, y0, y1, out, material) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute([p1.x, y0, p1.y, p2.x, y0, p2.y, p2.x, y1, p2.y, p1.x, y1, p1.y], 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 1, 0, 1, 1, 0, 1], 2));
  const n = new THREE.Vector3(out.x, 0, out.y).normalize();
  const cross = new THREE.Vector3(p2.x - p1.x, 0, p2.y - p1.y).cross(new THREE.Vector3(0, 1, 0));
  geo.setIndex(cross.dot(n) > 0 ? [0, 1, 2, 0, 2, 3] : [0, 2, 1, 0, 3, 2]);
  geo.setAttribute('normal', new THREE.Float32BufferAttribute([...n.toArray(), ...n.toArray(), ...n.toArray(), ...n.toArray()], 3));
  const m = new THREE.Mesh(geo, material); m.castShadow = m.receiveShadow = true; return m;
}
// грани: узлы сетки (cellLen × cellFloors) в шахматном порядке вынесены вперёд на depth, ячейки разломаны по диагонали — ромбы; края фасада в плоскости
function facets(a, b, y0, y1, out, material, floors, cellLen, cellFloors, depth) {
  const len = a.distanceTo(b), dir = new V2().subVectors(b, a).normalize(), n = new V2(out.x, out.y).normalize();
  const N = Math.max(2, Math.round(len / cellLen)), M = Math.max(2, Math.round(floors / cellFloors)), H = y1 - y0;
  const node = (k, m) => { const raised = (k + m) % 2 === 1 && k > 0 && k < N && m > 0 && m < M; const sx = len * k / N, yy = y0 + H * m / M; const p = a.clone().add(dir.clone().multiplyScalar(sx)).add(n.clone().multiplyScalar(raised ? depth : 0)); return { v: [p.x, yy, p.y], uv: [sx / len, (yy - y0) / H] }; };
  const pos = [], uv = [], tri = (p, q, r) => { for (const t of [p, q, r]) { pos.push(...t.v); uv.push(...t.uv); } };
  for (let k = 0; k < N; k++) for (let m = 0; m < M; m++) {
    const c00 = node(k, m), c10 = node(k + 1, m), c01 = node(k, m + 1), c11 = node(k + 1, m + 1);
    if ((k + m) % 2 === 1) { tri(c00, c10, c11); tri(c00, c11, c01); } else { tri(c00, c10, c01); tri(c10, c11, c01); }
  }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); geo.computeVertexNormals();
  const nr = geo.getAttribute('normal'); let dot = 0; for (let k = 0; k < nr.count; k++) dot += nr.getX(k) * n.x + nr.getZ(k) * n.y;
  if (dot < 0) { const P = geo.getAttribute('position'), U = geo.getAttribute('uv'); for (let k = 0; k < P.count; k += 3) for (const A of [P, U]) { const t = A.array.slice(A.itemSize * (k + 1), A.itemSize * (k + 2)); A.array.copyWithin(A.itemSize * (k + 1), A.itemSize * (k + 2), A.itemSize * (k + 3)); A.array.set(t, A.itemSize * (k + 2)); } geo.computeVertexNormals(); }
  const mesh = new THREE.Mesh(geo, material); mesh.castShadow = mesh.receiveShadow = true; return mesh;
}
// куда смотрят грани: азимут от юга (+ к востоку) и наклон стекла от вертикали
function facetAngles(mesh) {
  const P = mesh.geometry.getAttribute('position'), a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  let azMin = 999, azMax = -999, tilt = 0;
  for (let k = 0; k < P.count; k += 3) {
    a.fromBufferAttribute(P, k); b.fromBufferAttribute(P, k + 1); c.fromBufferAttribute(P, k + 2);
    const n = b.clone().sub(a).cross(c.clone().sub(a)); if (n.length() < 1e-6) continue; n.normalize();
    const az = Math.atan2(n.x, n.z) / rad; azMin = Math.min(azMin, az); azMax = Math.max(azMax, az); tilt = Math.max(tilt, Math.abs(Math.asin(n.y)) / rad);
  }
  return { azMin, azMax, tilt };
}
function slab(pl, y, thick, material) {
  const shape = new THREE.Shape(pl.map(p => new V2(p.x, -p.y)));
  const geo = new THREE.ExtrudeGeometry(shape, { depth: thick, bevelEnabled: false }); geo.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(geo, material); m.position.y = y; m.castShadow = m.receiveShadow = true; return m;
}
function offsetPlan(pl, d) {
  const L = pl.map((p, i) => { const q = pl[(i + 1) % pl.length], dir = new V2().subVectors(q, p).normalize(); const dd = typeof d === 'function' ? d(i) : d; return { p: p.clone().add(new V2(-dir.y, dir.x).multiplyScalar(dd)), dir }; });
  return pl.map((_, i) => { const l1 = L[(i + pl.length - 1) % pl.length], l2 = L[i]; const t = ((l2.p.x - l1.p.x) * l2.dir.y - (l2.p.y - l1.p.y) * l2.dir.x) / (l1.dir.x * l2.dir.y - l1.dir.y * l2.dir.x); return new V2(l1.p.x + l1.dir.x * t, l1.p.y + l1.dir.y * t); });
}
const rectPlan = (x0, z0, x1, z1) => [new V2(x0, z1), new V2(x1, z1), new V2(x1, z0), new V2(x0, z0)]; // обход как у плана башни
function label(text, x, y, z, parent, size = 7.8) {
  const c = document.createElement('canvas'), g = c.getContext('2d'), font = 'bold 46px system-ui, sans-serif';
  g.font = font; c.width = Math.ceil(g.measureText(text).width) + 40; c.height = 96;
  g.fillStyle = 'rgba(255,255,255,.85)'; g.fillRect(0, 0, c.width, 96); g.fillStyle = '#2b3a4a'; g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, c.width / 2, 50);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: toTex(c), depthTest: false, depthWrite: false })); s.scale.set(size * c.width / 96, size, 1); s.position.set(x, y, z); s.renderOrder = 10; parent.add(s);
}

// ---- Башня и подиум ----
let house = new THREE.Group(); scene.add(house);
let southAngles = null;
function build() {
  scene.remove(house); house = new THREE.Group(); seed = 11;
  const ev = opt.evening;
  const ceramic = new THREE.MeshPhysicalMaterial({ color: 0xefe9de, roughness: 0.45, clearcoat: 0.3, clearcoatRoughness: 0.4 });
  const y0 = PODIUM_H, yF = y0 + MAIN * FLOOR_H, yTop = yF + TOP_GLOW * FLOOR_H;
  for (const [i, j, out, type] of WALLS) {
    const a = PLAN[i], b = PLAN[j], len = a.distanceTo(b), isEnd = type === 'eastEnd' || type === 'westEnd';
    if (type === 'south' || type === 'cut' || (isEnd && opt.ends)) {
      let mods, m0;
      if (type === 'south') { mods = Math.floor((len - 1) / MODULE / 2) * 2 || 2; m0 = (len - mods * MODULE) / 2; }
      else if (type === 'cut') { mods = 1; m0 = (len - MODULE) / 2; }
      else { mods = 3; m0 = type === 'eastEnd' ? 0.6 : len - 0.6 - 3 * MODULE; } // на торце окна в южной части, у ядра глухая стена
      const gm = glassMaps(len, MAIN, m0, mods, ev, type !== 'south');
      const fm = new THREE.MeshPhysicalMaterial({ map: gm.map, roughness: 0.3, metalness: 0.05, clearcoat: 0.3, emissive: 0xffffff, emissiveMap: gm.emissiveMap, emissiveIntensity: ev ? 1 : 0 });
      if (type === 'south') { const m = facets(a, b, y0, yF, out, fm, MAIN, opt.cw * MODULE, opt.ch, opt.fold); southAngles = facetAngles(m); house.add(m); }
      else if (isEnd) house.add(facets(a, b, y0, yF, out, fm, MAIN, len / 2, opt.ch, opt.fold * 0.6));
      else house.add(wall(a, b, y0, yF, out, fm));
    } else {

  rect(-13, z0 + 7, 7, R.z0 - 19, C.stone, 0.055);

  feat('сухой фонтан: струи прямо из камня', [-3, z0 + 16], 7);
  boxAt(8, z0 + 7, 13, z0 + 20, 1.2, mat({ color: 0xcfc8bc })); feat('въезд в паркинг', [10.5, z0 + 13], 5);
  for (const x of [-22, 22]) for (let v = 8; v < 40; v += 8) tree(x, z0 + v, 7);
}

function buildGround() {
  const ground = rect(-4000, -4000, 4000, 4000, C.city, 0);
  // юг: тротуар с деревьями и кустами → дорога → тротуар у парка → парк
  rect(-700, R.z1, 700, S.walkS, C.walk, 0.04);
  rect(-700, S.walkS, 700, S.roadS, C.road, 0.03);
  rect(-700, S.roadS, 700, S.park, C.walk, 0.04);
  rect(-700, S.park, 700, 660, C.lawn, 0.02);
  // север: площадка у входа (высадка, въезд в паркинг) → улица → тротуар → сквер → город
  rect(-700, S.plazaN, 700, R.z0, C.walk, 0.04);
  rect(R.x0, T.z0, R.x1, R.z0, C.trav, 0.045);
  rect(-700, S.roadN, 700, S.plazaN, C.road, 0.03);
  rect(-700, S.walkN, 700, S.roadN, C.walk, 0.04);
  rect(-700, S.city, 700, S.walkN, C.lawn, 0.02);
  // боковые улицы за территорией
  rect(S.roadW, S.roadN, T.x0, S.roadS, C.road, 0.035);
  rect(S.roadE0, S.roadN, S.roadE1, S.roadS, C.road, 0.035);
  // разметка и переход к парку
  for (const zc of [(S.walkS + S.roadS) / 2, (S.roadN + S.plazaN) / 2]) for (let x = -700; x < 700; x += 9) rect(x, zc - 0.08, x + 3, zc + 0.08, C.mark, 0.06);
  for (let i = 0; i < 8; i++) rect(-6 + i * 1.1, S.walkS + 0.5, -5.5 + i * 1.1, S.roadS - 0.5, C.mark, 0.065);

  // тротуар перед подиумом: небольшие деревья через 9 м, между ними кусты
  for (let x = -700; x < 700; x += 9) {
    if (x > -10 && x < 6) continue;                                       // у перехода просвет
    tree(x, R.z1 + 7.5, 5 + rnd2());
    boxAt(x + 3.2, R.z1 + 7, x + 5.8, R.z1 + 8, 0.9, hedgeMat);
  }
  for (let x = -690; x < 700; x += 12) tree(x, (S.city + S.walkN) / 2 + (rnd2() - 0.5) * 8, 7 + rnd2() * 3); // сквер у северной улицы

  buildTerritory();

  // ---- Парк: деревья, пруд, дорожка от перехода ----
  const pond = new THREE.Mesh(new THREE.CircleGeometry(1, 48), mat({ color: C.water, roughness: 0.05, metalness: 0.4 }));
  pond.rotation.x = -Math.PI / 2; pond.scale.set(70, 38, 1); pond.position.set(-140, 0.03, 300); flat(pond, 0.03); scene.add(pond);
  rect(-8, S.park, -4, 200, C.stone, 0.03);
  for (let i = 0; i < 1100; i++) {
    const x = (rnd2() - 0.5) * 1400, z = S.park + 6 + rnd2() * 600;
    if (((x + 140) / 80) ** 2 + ((z - 300) / 46) ** 2 < 1) continue;     // пруд
    if (Math.abs(x + 6) < 6 && z < 200) continue;                         // дорожка
    if (((x - 120) / 60) ** 2 + ((z - 140) / 40) ** 2 < 1) continue;      // поляна
    tree(x, z, 8 + rnd2() * 6);
  }
  const dummy = new THREE.Object3D();
  const trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.25, 0.35, 1, 6), mat({ color: 0x8b8680 }), trees.length);
  const crowns = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 10, 8), mat({ color: 0xa9aea4, roughness: 1 }), trees.length);
  trees.forEach(([x, z, h], i) => {
    dummy.position.set(x, h * 0.25, z); dummy.scale.set(1, h * 0.5, 1); dummy.updateMatrix(); trunks.setMatrixAt(i, dummy.matrix);
    dummy.position.set(x, h * 0.65, z); dummy.scale.setScalar(h * 0.32); dummy.updateMatrix(); crowns.setMatrixAt(i, dummy.matrix);
  });
  trunks.castShadow = crowns.castShadow = true; crowns.receiveShadow = true; scene.add(trunks, crowns);
}

// ---- Город вокруг: край парка в городе ----
// Ближние соседи заданы вручную (расстояния до башни), дальше до горизонта город собирается из кварталов разной формы.
// Кварталы 3–9 эт. и несколько групп башен 14–25 эт. (не выше ≈ 78 м, почти вдвое ниже ИНСО)
const NEAR = [ // [x0, z0, x1, z1, этажей, форма, открытая сторона]
  ...[[-330, -245, 5], [-230, -150, 6], [-135, -65, 7], [-50, 40, 6], [55, 125, 7], [140, 220, 6], [235, 330, 5]].map(([a, b, f]) => [a, S.city - 18, b, S.city, f, 'office']),
  [S.cityE, S.plazaN, S.cityE + 80, R.z1, 6, 'U', 's'], [S.cityE + 95, S.plazaN, S.cityE + 175, R.z1, 7, 'L', 'w'],
  [S.cityW - 85, S.plazaN, S.cityW, R.z1, 6, 'ring'], [S.cityW - 180, S.plazaN, S.cityW - 100, R.z1, 7, 'bars'],
];
const NO_CITY = [ // где кварталов нет: участок с ближними соседями, дорога вдоль парка, парк
  [-350, S.city - 25, 350, S.roadS + 5], [-720, R.z1, 720, S.park], [-720, S.park, 720, 700],
];
const TOWER_SPOTS = [[650, -750, 350], [-950, -450, 300], [-250, -1500, 350], [900, 1150, 300]]; // где башни стоят группами
const FACADES = ['#d6d0c7', '#d9cbb8', '#c9cacb', '#e0dcd4', '#cfd0cf']; // последний — офисы
const TILE_W = 32, TILE_H = 31; // плитка фасада: 10 окон × 10 этажей
function facadeMat(i, ev) {
  const office = i === 4, col = canvas(TILE_W, TILE_H, 8), emi = canvas(TILE_W, TILE_H, 8), g = col.getContext('2d'), e = emi.getContext('2d');
  const H = col.height, y = m => H - m * 8;
  let s = 31 + i; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  g.fillStyle = FACADES[i]; g.fillRect(0, 0, col.width, H); e.fillStyle = '#000'; e.fillRect(0, 0, emi.width, H);
  const step = office ? 1.6 : 3.2, w = office ? 1.5 : 1.6, h = office ? 2.0 : 1.6, sill = office ? 0.6 : 0.9;
  for (let f = 0; f < 10; f++) for (let x = 0.8; x < TILE_W; x += step) {
    const lit = ev && r() < (office ? 0.15 : 0.35);
    g.fillStyle = lit ? '#e9c58f' : (ev ? '#2a313a' : '#8f979d'); g.fillRect(x * 8, y(f * NFLOOR + sill + h), w * 8, h * 8);
    if (lit) { e.fillStyle = '#6e5130'; e.fillRect(x * 8, y(f * NFLOOR + sill + h), w * 8, h * 8); }
  }
  const map = toTex(col), emissiveMap = toTex(emi);
  for (const t of [map, emissiveMap]) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return mat({ map, emissive: 0xffffff, emissiveMap, emissiveIntensity: ev ? 1 : 0 });
}
// все дома города складываются в несколько общих сеток: по одной на фасад, одна на крыши, одна на газоны дворов
const newCol = () => ({ pos: [], nor: [], uv: [] });
let cols, roofCol, lawnCol, cityTrees, tops;
function pushQuad(col, v, n, order) { for (const k of order) { col.pos.push(v[k][0], v[k][1], v[k][2]); col.uv.push(v[k][3], v[k][4]); col.nor.push(...n); } }
function pushWall(col, p1, p2, y0, y1, out, u0) {
  const len = p1.distanceTo(p2), dot = -(p2.y - p1.y) * out.x + (p2.x - p1.x) * out.y;
  pushQuad(col, [[p1.x, y0, p1.y, u0, y0 / TILE_H], [p2.x, y0, p2.y, u0 + len / TILE_W, y0 / TILE_H], [p2.x, y1, p2.y, u0 + len / TILE_W, y1 / TILE_H], [p1.x, y1, p1.y, u0, y1 / TILE_H]],
    [out.x, 0, out.y], dot > 0 ? [0, 1, 2, 0, 2, 3] : [0, 2, 1, 0, 3, 2]);
}
const pushFlat = (col, x0, z0, x1, z1, y) => pushQuad(col, [[x0, y, z0, 0, 0], [x1, y, z0, 0, 0], [x1, y, z1, 0, 0], [x0, y, z1, 0, 0]], [0, 1, 0], [0, 1, 2, 0, 2, 3]);
function box(fi, x0, z0, x1, z1, fl, r) {
  const pl = rectPlan(x0, z0, x1, z1), h = fl * NFLOOR;
  for (let i = 0; i < 4; i++) { const p = pl[i], q = pl[(i + 1) % 4], d = new V2().subVectors(q, p).normalize(); pushWall(cols[fi], p, q, 0, h, new V2(-d.y, d.x), Math.floor(r() * 10) * 0.1); }
  pushFlat(roofCol, x0, z0, x1, z1, h);
  return h;
}
// корпус: длинный иногда делится на секции разной высоты
function bar(fi, x0, z0, x1, z1, fl, r) {
  const alongX = x1 - x0 >= z1 - z0, L = alongX ? x1 - x0 : z1 - z0;
  if (L < 50 || r() < 0.4) return box(fi, x0, z0, x1, z1, fl, r);
  let a = 0;
  while (a < L) {
    const b = L - a < 40 ? L : a + 25 + r() * 20, f = Math.max(3, fl + [-1, 0, 0, 1, 2][Math.floor(r() * 5)]);
    if (alongX) box(fi, x0 + a, z0, x0 + b, z1, f, r); else box(fi, x0, z0 + a, x1, z0 + b, f, r);
    a = b;
  }
}
function courtyard(x0, z0, x1, z1, r) {
  pushFlat(lawnCol, x0, z0, x1, z1, 0.03);
  const n = 1 + Math.floor(r() * 3); for (let i = 0; i < n; i++) cityTrees.push([x0 + 4 + r() * (x1 - x0 - 8), z0 + 4 + r() * (z1 - z0 - 8), 6 + r() * 4]);
}
function block(x0, z0, x1, z1, fl, form, open, r, fi) {
  const D = 13 + Math.floor(r() * 3);
  const N = () => bar(fi, x0, z0, x1, z0 + D, fl, r), Sb = () => bar(fi, x0, z1 - D, x1, z1, fl, r);
  const Wb = (a, b) => bar(fi, x0, a, x0 + D, b, fl, r), Eb = (a, b) => bar(fi, x1 - D, a, x1, b, fl, r);
  switch (form) {
    case 'office': bar(4, x0, z0, x1, z1, fl, r); break;
    case 'ring': N(); Sb(); Wb(z0 + D, z1 - D); Eb(z0 + D, z1 - D); courtyard(x0 + D, z0 + D, x1 - D, z1 - D, r); break;
    case 'U':
      if (open === 's') { N(); Wb(z0 + D, z1); Eb(z0 + D, z1); } else if (open === 'n') { Sb(); Wb(z0, z1 - D); Eb(z0, z1 - D); }
      else if (open === 'e') { N(); Sb(); Wb(z0 + D, z1 - D); } else { N(); Sb(); Eb(z0 + D, z1 - D); }
      courtyard(x0 + D, z0 + D, x1 - D, z1 - D, r); break;
    case 'L': if (open === 'w') { N(); Eb(z0 + D, z1); } else { N(); Wb(z0 + D, z1); } courtyard(x0 + D, z0 + D, x1 - D, z1 - D, r); break;
    case 'bars': { const k = 2 + Math.floor(r() * 2), gap = (x1 - x0 - k * D) / (k - 1); for (let i = 0; i < k; i++) bar(fi, x0 + i * (D + gap), z0, x0 + i * (D + gap) + D, z1, fl, r); break; }
    case 'barsEW': { const k = 2 + Math.floor(r() * 2), gap = (z1 - z0 - k * D) / (k - 1); for (let i = 0; i < k; i++) bar(fi, x0, z0 + i * (D + gap), x1, z0 + i * (D + gap) + D, fl, r); break; }
    case 'points': { const s = 18 + r() * 4; for (const [u, v] of [[0.08, 0.1], [0.62, 0.1], [0.08, 0.6], [0.62, 0.6]]) box(fi, x0 + u * (x1 - x0), z0 + v * (z1 - z0), x0 + u * (x1 - x0) + s, z0 + v * (z1 - z0) + s, fl + Math.floor(r() * 2), r); courtyard(x0 + 30, z0 + 30, x1 - 30, z1 - 30, r); break; }
  }
}
// башня: точечная, пластина, двухступенчатая или пара
function tower(x0, z0, x1, z1, r) {
  const fl = 14 + Math.floor(r() * 12), kind = Math.floor(r() * 4), cx = (x0 + x1) / 2 + 12, cz = (z0 + z1) / 2 + 10, fi = Math.floor(r() * 5);
  let h;
  if (kind === 0) h = box(fi, cx - 11, cz - 11, cx + 11, cz + 11, fl, r);
  else if (kind === 1) { const ax = r() < 0.5; h = ax ? box(fi, cx - 24, cz - 8, cx + 24, cz + 8, fl - 4, r) : box(fi, cx - 8, cz - 24, cx + 8, cz + 24, fl - 4, r); }
  else if (kind === 2) { h = box(fi, cx - 11, cz - 11, cx + 11, cz + 11, fl, r); box(fi, cx - 33, cz - 11, cx - 11, cz + 11, fl - 7, r); }
  else { h = box(fi, cx - 26, cz - 9, cx - 8, cz + 9, fl, r); box(fi, cx + 6, cz - 9, cx + 24, cz + 9, fl - 3, r); }
  tops.push([cx, h, cz, Math.round(h / NFLOOR)]);
}
let city = new THREE.Group(); scene.add(city);
let labels = new THREE.Group(); scene.add(labels);
function buildCity() {
  scene.remove(city, labels); city = new THREE.Group(); labels = new THREE.Group();
  const ev = opt.evening;
  cols = FACADES.map(newCol); roofCol = newCol(); lawnCol = newCol(); cityTrees = []; tops = [];
  let s = 23; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (const [x0, z0, x1, z1, fl, form, open] of NEAR) {
    block(x0, z0, x1, z1, fl, form, open, r, Math.floor(r() * 4));
    label(`${fl} эт.`, (x0 + x1) / 2, fl * NFLOOR + 10, (z0 + z1) / 2, labels);
  }
  const BW = 100, BD = 88, ST = 22, FORMS = ['ring', 'ring', 'U', 'U', 'L', 'bars', 'barsEW', 'points'];
  for (let zz = S.city - 30 + 22 * (BD + ST); zz > -2300; zz -= BD + ST) for (let x0 = -2300; x0 < 2300; x0 += BW + ST) {
    const x1 = x0 + BW, z1 = zz, z0 = zz - BD;
    if (NO_CITY.some(([a, b, c, d]) => x0 < c && x1 > a && z0 < d && z1 > b)) continue;
    const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2, dist = Math.hypot(cx, cz), u = r();
    const spot = TOWER_SPOTS.some(([tx, tz, tr]) => Math.hypot(cx - tx, cz - tz) < tr);
    if (Math.abs(cx) > 160 && dist > 260 && r() < (spot ? 0.4 : 0.04)) { block(x0, z0, x1, z1, 5 + Math.floor(r() * 3), 'L', 'e', r, Math.floor(r() * 4)); tower(x0, z0, x1, z1, r); continue; }
    if (u < 0.1) { block(x0, z0, x1 - 10, z1 - 20, 4 + Math.floor(r() * 4), 'office', null, r, 4); continue; }
    const low = u > 0.88, fl = low ? 3 + Math.floor(r() * 2) : 5 + Math.floor(r() * 5);
    block(x0, z0, x1, z1, Math.min(fl, 9), FORMS[Math.floor(r() * FORMS.length)], 'nsew'[Math.floor(r() * 4)], r, Math.floor(r() * 4));
  }
  const geo = c => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(c.pos, 3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(c.nor, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(c.uv, 2)); return g; };
  cols.forEach((c, i) => { if (!c.pos.length) return; const m = new THREE.Mesh(geo(c), facadeMat(i, ev)); m.castShadow = m.receiveShadow = true; city.add(m); });
  const roofs = new THREE.Mesh(geo(roofCol), mat({ color: 0xbdb8b1, side: THREE.DoubleSide })); roofs.castShadow = roofs.receiveShadow = true; city.add(roofs);
  const lawns = flat(new THREE.Mesh(geo(lawnCol), mat({ color: C.lawn, roughness: 1 })), 0.03); city.add(lawns);
  const dummy = new THREE.Object3D(), crowns = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 8, 6), mat({ color: 0xa9aea4, roughness: 1 }), cityTrees.length);
  cityTrees.forEach(([x, z, h], i) => { dummy.position.set(x, h * 0.6, z); dummy.scale.setScalar(h * 0.35); dummy.updateMatrix(); crowns.setMatrixAt(i, dummy.matrix); });
  crowns.castShadow = true; city.add(crowns);
  for (const [x, h, z, fl] of tops) label(`${fl} эт.`, x, h + 10, z, labels);
  label('ИНСО · 141 м', 0, 152, 0, labels);
  for (const [t, x, y, z] of FEATURES) label(t, x, y, z, labels, 3.2);
  label('парк', 60, 22, S.park + 120, labels);
  city.visible = opt.nb; labels.visible = opt.labels;
  scene.add(city, labels);
}

// ---- Свет ----
function sunPos(t) {
  const H = 15 * (t - 12) * rad, phi = LAT * rad, d = DATES[opt.date].decl * rad;
  const alt = Math.asin(Math.sin(phi) * Math.sin(d) + Math.cos(phi) * Math.cos(d) * Math.cos(H));
  const az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(d) * Math.cos(phi));
  return { alt, az };
}
const tSlider = document.getElementById('tSlider');
function setDayBounds() {
  const d = DATES[opt.date].decl * rad, H0 = Math.acos(-Math.tan(LAT * rad) * Math.tan(d)) / rad / 15;
  tSlider.min = Math.ceil((12 - H0 + 0.2) * 4) / 4; tSlider.max = Math.floor((12 + H0 - 0.2) * 4) / 4;
}
function applyLight() {
  const t = +tSlider.value;
  document.getElementById('tLabel').textContent = `${Math.floor(t)}:${String(Math.round((t % 1) * 60)).padStart(2, '0')}`;
  let dir;
  if (opt.evening) {
    scene.background = new THREE.Color(0x3c4d68); scene.fog.color.set(0x3c4d68); hemi.color.set(0x8fa3c4); hemi.groundColor.set(0x30343a); hemi.intensity = 0.45;
    dir = new THREE.Vector3(-0.7, 0.25, -0.6); sun.intensity = 0.12;
  } else {
    scene.background = new THREE.Color(0xdcdfe3); scene.fog.color.set(0xdcdfe3); hemi.color.set(0xffffff); hemi.groundColor.set(0xb8bcc0);
    if (opt.sun) { const { alt, az } = sunPos(t); dir = new THREE.Vector3(-Math.sin(az) * Math.cos(alt), Math.sin(alt), Math.cos(az) * Math.cos(alt)); sun.intensity = alt > 0 ? 2.4 : 0; hemi.intensity = 0.6; }
    else { dir = new THREE.Vector3(-0.6, 0.55, 0.58); sun.intensity = 1.5; hemi.intensity = 0.95; }
  }
  sun.position.copy(dir.normalize().multiplyScalar(600)); sun.target.position.set(0, 0, 0);
}

// ---- Управление ----
const dateSel = document.getElementById('date');
for (const [k, v] of Object.entries(DATES)) dateSel.add(new Option(v.name, k));
dateSel.value = opt.date;
for (const k of ['fold', 'cw', 'ch']) { const el = document.getElementById(k); el.value = opt[k]; el.oninput = () => { opt[k] = +el.value; build(); }; }
for (const k of ['ends', 'street']) { const el = document.getElementById(k); el.checked = opt[k]; el.onchange = () => { opt[k] = el.checked; build(); }; }
const nbEl = document.getElementById('nb'), lbEl = document.getElementById('labels'), evEl = document.getElementById('evening'), sunEl = document.getElementById('sun');
nbEl.checked = opt.nb; nbEl.onchange = () => { opt.nb = city.visible = nbEl.checked; };
lbEl.checked = opt.labels; lbEl.onchange = () => { opt.labels = labels.visible = lbEl.checked; };
evEl.checked = opt.evening; evEl.onchange = () => { opt.evening = evEl.checked; buildCity(); build(); };
sunEl.checked = opt.sun; sunEl.onchange = () => { opt.sun = sunEl.checked; applyLight(); };
dateSel.onchange = () => { opt.date = dateSel.value; setDayBounds(); applyLight(); };
tSlider.oninput = applyLight;

const views = {
  park:    { pos: [95, 6, 290], target: [2, 70, 8] },
  street:  { pos: [16, 1.7, S.park + 2], target: [-6, 16, R.z1] },
  territory: { pos: [0, 190, 230], target: [0, 0, -20] },
  west:    { pos: [T.x0 - 15, 32, T.z1 + 30], target: [T.x0 + 60, 2, (T.z0 + T.z1) / 2] },
  east:    { pos: [T.x1 + 15, 32, T.z1 + 30], target: [T.x1 - 60, 2, (T.z0 + T.z1) / 2] },
  corner:  { pos: [-170, 40, 170], target: [-15, 70, 5] },
  crown:   { pos: [-80, 160, 120], target: [0, 130, 5] },
  far:     { pos: [-200, 45, 560], target: [0, 70, 0] },
  behind:  { pos: [-160, 110, 640], target: [0, 40, -500] },
  quarter: { pos: [300, 280, 420], target: [0, 20, -30] },
  top:     { pos: [0, 640, 1], target: [0, 0, -20] },
};
function setView(name) {
  const v = views[name]; if (!v) return;
  camera.position.set(...v.pos); controls.target.set(...v.target); controls.update();
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === name));
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
setDayBounds();
tSlider.value = params.get('t') || 12;
buildGround();
buildCity();
build();
setView(params.get('view') || 'park');
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
