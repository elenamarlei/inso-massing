<script type="module">
import * as THREE from 'three';
const V2 = THREE.Vector2, V3 = THREE.Vector3;

// ---- Те же параметры дома, что в grani-40-kvartal (вынос 6 м, грань 2 окна × 5 этажей) ----
const ROT = 20, LEN = 40, DEPTH = 16, CUT = 4, MODULE = 3.4, FLOOR_H = 3.6, PODIUM_H = 9, MAIN = 38;
const FOLD = 6, CW = 2, CH = 5, SLAB = 0.3, APT = 7.5; // перекрытие 0,3 м, глубина квартир 7,5 м до коридора
const LAT = 55, DECL = -18.6, rad = Math.PI / 180;
const ZONES = [
  { from: 0,  count: 12, floors: 3, mods: 2, vw: 0.8, hh: 0.6 },
  { from: 12, count: 12, floors: 2, mods: 2, vw: 0.6, hh: 0.5 },
  { from: 24, count: 14, floors: 1, mods: 1, vw: 0.4, hh: 0.35 },
];
const params = new URLSearchParams(location.search);
if (params.get('clean')) document.body.classList.add('clean');
const opt = { type: ['bedroom', 'lounge'].includes(params.get('type')) ? params.get('type') : 'living', floor: +(params.get('floor') || 20), room: +(params.get('room') || 3), width: +(params.get('width') || (params.get('type') === 'bedroom' ? 2 : 3)), time: +(params.get('t') || 13), furn: params.get('furn') !== '0', person: params.get('person') === '1' };

// ---- Южный фасад: линия от P1 до B, грани — сетка узлов, через один вынесены на FOLD ----
const dirS = new V2(Math.cos(ROT * rad), -Math.sin(ROT * rad)), nS = new V2(Math.sin(ROT * rad), Math.cos(ROT * rad));

const L = P1.distanceTo(Bp), N = Math.max(2, Math.round(L / (CW * MODULE))), M = Math.max(2, Math.round(MAIN / CH)), Y0 = PODIUM_H, H = MAIN * FLOOR_H;

  const u = Math.min(N - 1e-6, Math.max(0, s / L * N)), v = Math.min(M - 1e-6, Math.max(0, (y - Y0) / H * M));

// ---- Рендер ----
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);

let drag = null;
renderer.domElement.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; renderer.domElement.setPointerCapture(e.pointerId); });

addEventListener('blur', () => keys.clear());
let lastT = performance.now();
function moveStep() { // шаг движения за кадр: обычный 1,5 м/с, Shift — 4 м/с, Alt — 0,25 м/с
  const now = performance.now(), dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;

  const fwd = new V3(-Math.sin(look.yaw), 0, -Math.cos(look.yaw)), right = new V3(Math.cos(look.yaw), 0, -Math.sin(look.yaw));

  if (keys.has('KeyD') || keys.has('ArrowRight')) camera.position.addScaledVector(right, sp);
  if (keys.has('KeyA') || keys.has('ArrowLeft')) camera.position.addScaledVector(right, -sp);
  if (keys.has('KeyE') || keys.has('PageUp')) camera.position.y += sp;
  if (keys.has('KeyQ') || keys.has('PageDown')) camera.position.y -= sp;
}
const hemi = new THREE.HemisphereLight(0xffffff, 0x8a8f86, 0.7); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 3); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -25, right: 25, top: 25, bottom: -25, near: 1, far: 400 }); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
const mat = o => new THREE.MeshStandardMaterial({ roughness: 0.85, ...o });
const PX = 40;
function canvasTex(w, h, draw, repeat) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; }

// ---- Небо и город за окном ----
const skyCanvas = document.createElement('canvas'); skyCanvas.width = 4; skyCanvas.height = 512;
const skyTex = new THREE.CanvasTexture(skyCanvas); skyTex.colorSpace = THREE.SRGBColorSpace;
const sky = new THREE.Mesh(new THREE.SphereGeometry(4000, 32, 16), new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false })); scene.add(sky);
function paintSky(stops) { const g = skyCanvas.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 512); for (const [p, c] of stops) gr.addColorStop(p, c); g.fillStyle = gr; g.fillRect(0, 0, 4, 512); skyTex.needsUpdate = true; }
scene.fog = new THREE.Fog(0xcfd6de, 600, 3200);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(9000, 9000), mat({ color: 0xa9ad9f })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
{ // парк перед домом, дорога, город по сторонам и вдали; окна города вечером горят
  const park = new THREE.Mesh(new THREE.PlaneGeometry(1400, 640), mat({ color: 0x8fa07e })); park.rotation.x = -Math.PI / 2; park.position.set(0, 0.05, 380); scene.add(park);
  const road = new THREE.Mesh(new THREE.PlaneGeometry(1400, 12), mat({ color: 0x5f6266 })); road.rotation.x = -Math.PI / 2; road.position.set(0, 0.06, 45); scene.add(road);
  let s = 3; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const tg = new THREE.SphereGeometry(1, 8, 6), tm = mat({ color: 0x7d8f6a }), trees = new THREE.InstancedMesh(tg, tm, 1500), dm = new THREE.Object3D();
  for (let i = 0; i < 1500; i++) { const h = 8 + r() * 6; dm.position.set((r() - 0.5) * 1300, h * 0.6, 70 + r() * 600); dm.scale.setScalar(h * 0.38); dm.updateMatrix(); trees.setMatrixAt(i, dm.matrix); }
  scene.add(trees);
  const winTex = lit => canvasTex(64, 64, (g) => { g.fillStyle = lit ? '#2a2f38' : '#cfcac2'; g.fillRect(0, 0, 64, 64); for (let y = 4; y < 64; y += 16) for (let x = 4; x < 64; x += 16) { g.fillStyle = lit ? (Math.random() < 0.4 ? '#e9b56a' : '#3a404a') : '#7d858d'; g.fillRect(x, y, 8, 8); } }, true);
  window.CITY = { day: mat({ map: winTex(false) }), night: mat({ map: winTex(true), emissive: 0xffffff, emissiveMap: winTex(true), emissiveIntensity: 0.9 }) };
  const city = new THREE.Group(); scene.add(city); window.CITYG = city;
  for (let i = 0; i < 420; i++) {
    const a = r() * Math.PI * 2, d = 260 + r() * 1800, x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (z > 40 && z < 720 && Math.abs(x) < 700) continue; // парк остаётся свободным
    const w = 18 + r() * 40, dd = 14 + r() * 30, h = (r() < 0.1 ? 16 + r() * 10 : 4 + r() * 6) * 3.1;
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, dd), CITY.day); b.position.set(x, h / 2, z);
    for (const t of [b.material.map]) { /* общая текстура */ }
    city.add(b);
  }
}

// ---- Дом: стекло граней с рамами, перекрытия соседних этажей, комната ----
let house = new THREE.Group(); scene.add(house);
const facadeTex = (() => canvasTex(Math.round(L * PX / 2), Math.round(H * PX / 2), (g, w, h) => { // прозрачный фон, импосты, кромки перекрытий, керамические рамы снаружи
  const sx = w / L, sy = h / H, y = mm => h - mm * sy;
  g.clearRect(0, 0, w, h);
  g.fillStyle = '#2f2a26';
  for (let k = 0; k <= MODS; k++) g.fillRect((M0 + k * MODULE) * sx - 0.05 * sx, 0, 0.1 * sx, h);          // импосты по шагу 3,4 м
  for (let k = 0; k < MODS; k++) g.fillRect((M0 + k * MODULE + MODULE * 0.72) * sx - 0.03 * sx, 0, 0.06 * sx, h); // створка для проветривания
  g.fillStyle = '#e6e0d6';
  for (let f = 0; f <= MAIN; f++) g.fillRect(0, y(f * FLOOR_H) - 0.15 * sy, w, 0.3 * sy);              // кромка перекрытия
  g.fillStyle = '#efe9de'; g.fillRect(0, 0, M0 * sx, h); g.fillRect((M0 + MODS * MODULE) * sx, 0, w - (M0 + MODS * MODULE) * sx, h);
  for (const z of ZONES) { // светлые керамические рамы
    const yb = y(z.from * FLOOR_H), yt = y((z.from + z.count) * FLOOR_H);
    for (let k = 0; k <= MODS; k += z.mods) g.fillRect((M0 + k * MODULE - z.vw / 2) * sx, yt, z.vw * sx, yb - yt);
    for (let f = z.from; f <= z.from + z.count; f += z.floors) g.fillRect((M0 - z.vw / 2) * sx, y(f * FLOOR_H) - z.hh / 2 * sy, (MODS * MODULE + z.vw) * sx, z.hh * sy);
  }
}))();
function facadeGeo() { // та же сетка граней, что в большой болванке
  const pos = [], uv = [], node = (k, m) => { const s = L * k / N, yy = Y0 + H * m / M, p = W(s, raisedD(k, m), yy); return { v: [p.x, p.y, p.z], uv: [s / L, m / M] }; };
  const tri = (a, b, c) => { for (const t of [a, b, c]) { pos.push(...t.v); uv.push(...t.uv); } };
  for (let k = 0; k < N; k++) for (let m = 0; m < M; m++) {
    const c00 = node(k, m), c10 = node(k + 1, m), c01 = node(k, m + 1), c11 = node(k + 1, m + 1);
    if ((k + m) % 2 === 1) { tri(c00, c10, c11); tri(c00, c11, c01); } else { tri(c00, c10, c01); tri(c10, c11, c01); }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.computeVertexNormals(); return g;
}
const slice = (y, s0 = 0, s1 = L, inset = 0, step = 0.2) => { const pts = []; for (let s = s0; s <= s1 + 1e-6; s += step) pts.push([Math.min(s, s1), offsetAt(Math.min(s, s1), y) - inset]); if (pts[pts.length - 1][0] < s1) pts.push([s1, offsetAt(s1, y) - inset]); return pts; };
function flatPoly(pts2, y, material, down) { // многоугольник в плане (мировые x,z) на высоте y
  const shape = new THREE.Shape(pts2.map(p => down ? new V2(p.x, p.z) : new V2(p.x, -p.z)));
  const g = new THREE.ShapeGeometry(shape); g.rotateX(down ? Math.PI / 2 : -Math.PI / 2); const m = new THREE.Mesh(g, material); m.position.y = y; m.receiveShadow = true; return m;
}
function slabAt(f, s0 = 0, s1 = L) { // перекрытие этажа: от коридора до стекла на уровне пола
  const y = Y0 + f * FLOOR_H, edge = slice(y, s0, s1).map(([s, d]) => W(s, d, 0));
  const pts = [W(s0, -APT, 0), ...edge, W(s1, -APT, 0)];
  const shape = new THREE.Shape(pts.map(p => new V2(p.x, -p.z))), g = new THREE.ExtrudeGeometry(shape, { depth: SLAB, bevelEnabled: false }); g.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, mat({ color: 0xd9d4cc })); m.position.y = y - SLAB; m.castShadow = m.receiveShadow = true; return m;

function quad(a, b, c, d, material) { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute([...a.toArray(), ...b.toArray(), ...c.toArray(), ...a.toArray(), ...c.toArray(), ...d.toArray()], 3)); g.computeVertexNormals(); const m = new THREE.Mesh(g, material); m.castShadow = m.receiveShadow = true; return m; }

  const pos = []; for (let i = 0; i < pts.length - 1; i++) { const [s0, d0] = pts[i], [s1, d1] = pts[i + 1]; const a = W(s0, d0, y), b = W(s1, d1, y), c = W(s1, d1 - w, y), e = W(s0, d0 - w, y); pos.push(...a.toArray(), ...b.toArray(), ...c.toArray(), ...a.toArray(), ...c.toArray(), ...e.toArray()); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals(); const m = new THREE.Mesh(g, material); m.material.side = THREE.DoubleSide; return m;
}
const oak = canvasTex(512, 512, (g, w, h) => { g.fillStyle = '#cdb595'; g.fillRect(0, 0, w, h); for (let x = 0; x < w; x += 32) { g.fillStyle = `rgba(120,90,60,${0.05 + Math.random() * 0.08})`; g.fillRect(x, 0, 32, h); g.fillStyle = 'rgba(90,70,50,.25)'; g.fillRect(x, 0, 1, h); } for (let i = 0; i < 40; i++) { g.fillStyle = 'rgba(90,70,50,.18)'; g.fillRect(Math.floor(Math.random() * 16) * 32, Math.random() * h, 32, 1); } }, true);
oak.repeat.set(0.5, 0.5);
const CEIL = new THREE.MeshStandardMaterial({ color: 0xf4f2ee, roughness: 0.95, side: THREE.DoubleSide });
const GLOW = new THREE.MeshStandardMaterial({ color: 0xfbfaf7, roughness: 0.95, emissive: 0xffffff, emissiveIntensity: 0, side: THREE.DoubleSide });
const interiorLights = [];
let room = {};
function build() {
  scene.remove(house); house = new THREE.Group(); interiorLights.length = 0;
  // стекло граней на всю высоту и рамы поверх
  const fg = facadeGeo();
  house.add(new THREE.Mesh(fg, new THREE.MeshPhysicalMaterial({ color: 0xeef3f4, roughness: 0.03, metalness: 0, transparent: true, opacity: 0.1, side: THREE.DoubleSide, depthWrite: false, envMapIntensity: 1 })));
  const fr = new THREE.Mesh(fg, mat({ map: facadeTex, transparent: true, alphaTest: 0.3, side: THREE.DoubleSide, roughness: 0.5 })); fr.castShadow = true; house.add(fr);
  // перекрытия этажей ниже и выше — видны через наклонное стекло соседних граней
  for (let f = opt.floor - 6; f <= opt.floor + 7; f++) if (f >= 0 && f <= MAIN) house.add(slabAt(f));

  const s0 = M0 + opt.room * MODULE, s1 = s0 + opt.width * MODULE, yF = Y0 + opt.floor * FLOOR_H, yC = yF + FLOOR_H - SLAB, sm = (s0 + s1) / 2;
  room = { s0, s1, yF, yC, sm };
  const floorEdge = slice(yF + 0.01, s0, s1, 0.02);
  house.add(flatPoly([W(s0, -APT, 0), ...floorEdge.map(([s, d]) => W(s, d, 0)), W(s1, -APT, 0)], yF + 0.005, mat({ map: oak, roughness: 0.7 })));

  const ceilEdge = slice(yC - 0.01, s0, s1, 0.02);
  house.add(flatPoly([W(s0, -APT, 0), ...ceilEdge.map(([s, d]) => W(s, d, 0)), W(s1, -APT, 0)], yC - 0.005, CEIL, true));
  const glowEdge = slice(yC - 0.01, s0 + 0.3, s1 - 0.3, 1.8);
  house.add(flatPoly([W(s0 + 0.3, -APT + 0.3, 0), ...glowEdge.map(([s, d]) => W(s, d, 0)), W(s1 - 0.3, -APT + 0.3, 0)], yC - 0.012, GLOW, true));

  // стены квартиры: белые, перегородки до самого стекла

  // мебель и человек для масштаба (локально: x вдоль фасада, z к окну)
  const grp = new THREE.Group(); grp.position.copy(W(sm, 0, yF)); grp.rotation.y = Math.atan2(-dirS.y, dirS.x); house.add(grp);
  const B = (w, h, d, x, y, z, m) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y + h / 2, z); b.castShadow = b.receiveShadow = true; grp.add(b); return b; };
  if (opt.furn) { // мебель ровно та, что описана в промптах; локально: x вдоль фасада (−w/2…w/2), z к окну (0 — основная линия фасада, −7,5 — коридор)
    const hw = (s1 - s0) / 2, back = -APT;
    const M_ = { boucle: mat({ color: 0xe9e2d6, roughness: 1 }), cognac: mat({ color: 0x9a5f3a, roughness: 0.6 }), trav: mat({ color: 0xdcccb0, roughness: 0.8 }), bronze: mat({ color: 0x5b4632, metalness: 0.6, roughness: 0.4 }),
      rug: mat({ color: 0xe3d9c6, roughness: 1 }), oakDark: mat({ color: 0xa98457, roughness: 0.6 }), ash: mat({ color: 0xd9c4a0, roughness: 0.7 }), linen: mat({ color: 0xf3efe7, roughness: 1 }), art: mat({ color: 0xb98a5e }), dark: mat({ color: 0x3b332b }) };
    const C = (r, h, x, y, z, m, sx = 1, sz = 1) => { const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 32), m); c.position.set(x, y + h / 2, z); c.scale.set(sx, 1, sz); c.castShadow = c.receiveShadow = true; grp.add(c); return c; };
    const armchair = (x, z, rot) => { const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rot; grp.add(g); const add = (w, h, d, xx, yy, zz) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M_.cognac); b.position.set(xx, yy + h / 2, zz); b.castShadow = true; g.add(b); };
      add(0.85, 0.42, 0.85, 0, 0, 0); add(0.85, 0.4, 0.16, 0, 0.42, -0.36); add(0.14, 0.2, 0.85, -0.36, 0.42, 0); add(0.14, 0.2, 0.85, 0.36, 0.42, 0); };
    // шкаф-стена из ясеня вдоль одной перегородки — до половины глубины комнаты
    if (opt.type !== 'lounge') B(0.6, FLOOR_H - SLAB - 0.02, 4.2, -hw + 0.3, 0, back + 2.1, M_.ash); // в гостиной с камином вместо шкафа стеновая панель
    if (opt.type !== 'lounge') for (let k = 0; k < 6; k++) B(0.01, FLOOR_H - SLAB - 0.3, 0.004, -hw + 0.605, 0.15, back + 0.35 + k * 0.7, M_.dark); // щели фасадов
    if (opt.type === 'lounge') { // как на референсах: слева камин и стеновая панель, по центру изогнутый диван и травертиновые столики, справа картина и скульптура
      B(0.9, 0.42, 5.2, -hw + 0.45, 0, back + 3.2, mat({ color: 0x2e2a27, roughness: 0.5 }));            // длинный низкий камин-скамья из тёмного камня
      B(2.2, 0.12, 0.35, -hw + 0.55, 0.42, back + 3.2, mat({ color: 0xffb35c, emissive: 0xff8a2a, emissiveIntensity: 1.2 })).rotation.y = Math.PI / 2; // пламя
      B(0.5, FLOOR_H - SLAB - 0.44, 5.2, -hw + 0.25, 0.42, back + 3.2, mat({ color: 0xd8cdbd, roughness: 0.9 })); // стеновая панель над камином
      B(4.6, 0.012, 3.6, -hw + 2.9, 0, -3.4, M_.rug);
      for (let i = 0; i < 9; i++) { const a = -0.85 + i * 0.2125, r0 = 1.9, cx = -hw + 2.8, cz = -3.4; const b = B(0.9, 0.42, 0.78, cx + Math.cos(a) * r0, 0, cz + Math.sin(a) * r0, M_.boucle); b.rotation.y = Math.PI / 2 - a; const bb = B(0.9, 0.36, 0.2, cx + Math.cos(a) * (r0 + 0.39), 0.42, cz + Math.sin(a) * (r0 + 0.39), M_.boucle); bb.rotation.y = Math.PI / 2 - a; } // изогнутый диван дугой, боком к камере, лицом к камину
      C(0.5, 0.36, -hw + 2.6, 0, -3.7, M_.trav); C(0.38, 0.3, -hw + 1.9, 0, -3.0, M_.trav);                         // два круглых столика из травертина
      B(0.3, 0.1, 0.22, -hw + 2.6, 0.36, -3.7, M_.dark); C(0.08, 0.3, -hw + 2.8, 0.36, -3.6, M_.linen);
      C(0.2, 0.55, -hw + 4.4, 0, -5.9, M_.trav); C(0.09, 0.25, -hw + 4.4, 0.55, -5.9, M_.linen);                       // столик у края дивана
      armchair(-hw + 1.5, -1.5, 0.6); armchair(-hw + 4.2, -1.4, -0.5);                                             // два кресла у окна
      // обеденная зона без кухни: овальный стол на 8 мест из ореха, стулья в коже
      C(1.5, 0.75, hw - 2.6, 0, -4.0, M_.oakDark, 1, 0.42); C(0.35, 0.72, hw - 2.6, 0, -4.0, M_.bronze);
      for (const [dx, dz, r] of [[-0.9, -0.95, 0], [0, -0.95, 0], [0.9, -0.95, 0], [-0.9, 0.95, Math.PI], [0, 0.95, Math.PI], [0.9, 0.95, Math.PI], [-1.85, 0, Math.PI / 2], [1.85, 0, -Math.PI / 2]]) {
        const ch = B(0.5, 0.46, 0.5, hw - 2.6 + dx, 0, -4.0 + dz, M_.cognac); ch.rotation.y = r;
        const bk = B(0.5, 0.45, 0.08, hw - 2.6 + dx - Math.sin(r) * 0.22, 0.46, -4.0 + dz + (Math.abs(r) === Math.PI ? 0.22 : r === 0 ? -0.22 : 0), M_.cognac); bk.rotation.y = r; if (Math.abs(r) === Math.PI / 2) bk.position.x = hw - 2.6 + dx + (r > 0 ? -0.22 : 0.22);
      }
      C(0.1, 0.35, hw - 2.6, 0.75, -4.0, M_.linen);                                                       // ваза с цветами на столе
      B(0.04, 1.6, 1.2, hw - 0.03, 1.0, -4.2, M_.art);                                                    // картина на правой стене
      B(0.4, 1.0, 0.4, hw - 0.6, 0, -1.6, M_.trav); C(0.12, 0.8, hw - 0.6, 1.0, -1.6, M_.bronze);          // скульптура на постаменте
    } else if (opt.type === 'living') {
      B(3.8, 0.012, 2.8, 0.2, 0, -3.5, M_.rug);
      B(3.0, 0.42, 1.0, 0.2, 0, -5.0, M_.boucle); B(3.0, 0.38, 0.22, 0.2, 0.42, -5.39, M_.boucle); B(0.24, 0.2, 1.0, -1.18, 0.42, -5.0, M_.boucle); B(0.24, 0.2, 1.0, 1.58, 0.42, -5.0, M_.boucle); // низкий диван лицом к окну
      B(1.2, 0.08, 0.5, -0.4, 0.42, -4.75, M_.linen); // плед
      C(0.75, 0.36, 0.2, 0, -3.4, M_.trav, 1.25, 0.75);  // овальный журнальный стол из травертина
      B(0.3, 0.12, 0.22, -0.05, 0.36, -3.45, M_.dark); B(0.26, 0.05, 0.2, -0.05, 0.48, -3.45, M_.art); C(0.09, 0.32, 0.45, 0.36, -3.3, M_.linen); // книги, ваза
      C(0.22, 0.5, -1.65, 0, -5.0, M_.bronze); C(0.22, 0.5, 2.05, 0, -5.0, M_.bronze); // бронзовые приставные столики
      armchair(2.4, -3.0, -1.0); armchair(-1.8, -2.6, 0.9);                            // два кресла из коньячной кожи
      B(2.6, 0.75, 0.45, 0.6, 0, back + 0.25, M_.oakDark);                              // длинный комод из дуба у задней стены
      C(0.12, 0.35, 1.4, 0.75, back + 0.25, M_.linen); B(0.35, 0.08, 0.25, 0.1, 0.75, back + 0.25, M_.dark);
      B(1.7, 1.15, 0.04, 0.6, 1.25, back + 0.03, M_.art);                               // большая абстрактная картина
    } else {
      B(3.2, 0.012, 3.6, 0.3, 0, back + 2.3, M_.rug);
      B(1.9, 0.32, 2.1, 0.3, 0.12, back + 1.25, M_.oakDark); B(1.9, 0.26, 2.05, 0.3, 0.44, back + 1.25, M_.linen); // кровать 180 × 200 изголовьем к задней стене
      B(2.3, 1.25, 0.14, 0.3, 0, back + 0.1, M_.boucle);                                // мягкое изголовье
      B(1.85, 0.08, 0.7, 0.3, 0.7, back + 1.9, M_.rug); B(0.6, 0.14, 0.35, -0.15, 0.7, back + 0.45, M_.linen); B(0.6, 0.14, 0.35, 0.75, 0.7, back + 0.45, M_.linen); // покрывало, подушки
      B(0.5, 0.5, 0.42, -1.05, 0, back + 0.3, M_.oakDark); B(0.5, 0.5, 0.42, 1.65, 0, back + 0.3, M_.oakDark); // тумбы
      C(0.08, 0.28, -1.05, 0.5, back + 0.3, M_.linen); B(0.25, 0.06, 0.18, 1.65, 0.5, back + 0.3, M_.dark);
      B(1.6, 0.45, 0.45, 0.3, 0, back + 2.55, M_.cognac);                               // скамья в ногах кровати
      B(1.3, 0.9, 0.04, 0.3, 1.45, back + 0.03, M_.art);                                // картина над изголовьем
      armchair(2.6, -1.9, -0.6); C(0.25, 0.45, 1.85, 0, -1.6, M_.trav);                 // кресло и столик у окна

  if (opt.person) { const pm = mat({ color: 0x8c8780 }); const body = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.16, 1.5, 12), pm); body.position.set(0.6, 0.75, -1.4); grp.add(body); const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 10), pm); head.position.set(0.6, 1.62, -1.4); grp.add(head); }
  scene.add(house);
  // сколько грань выступает и как наклонено стекло в этой комнате
  let dMin = 99, dMax = -99, tilt = 0; for (let s = s0; s <= s1; s += 0.2) { const a = offsetAt(s, yF), b = offsetAt(s, yC); dMin = Math.min(dMin, a, b); dMax = Math.max(dMax, a, b); tilt = Math.max(tilt, Math.abs(Math.atan2(b - a, yC - yF)) / rad); }
  let area = 0; for (let x = s0; x < s1; x += 0.05) area += 0.05 * (APT + offsetAt(x + 0.025, yF)); // площадь пола комнаты с выступами граней
  document.getElementById('info').textContent = `Площадь комнаты ≈ ${Math.round(area)} м². Этаж ${opt.floor}, комната ${(s1 - s0).toFixed(1).replace('.', ',')} м вдоль фасада, глубина до коридора ${APT.toString().replace('.', ',')} м + выступ грани. Стекло в этой комнате выдвинуто от ${dMin.toFixed(1).replace('.', ',')} до ${dMax.toFixed(1).replace('.', ',')} м от основной линии фасада и наклонено до ${Math.round(tilt)}° от вертикали. Высота от пола до потолка ${(FLOOR_H - SLAB).toFixed(1).replace('.', ',')} м. Потолок светится в глубине, полоса 1,8 м у окна не светится; конвектор в полу вдоль стекла.`;
  document.querySelectorAll('[data-type]').forEach(b => b.classList.toggle('on', b.dataset.type === opt.type));
  document.getElementById('floorLabel').textContent = opt.floor; document.getElementById('roomLabel').textContent = `с ${opt.room + 1}-го окна`; document.getElementById('widthLabel').textContent = `${opt.width} окна (${(opt.width * MODULE).toFixed(1).replace('.', ',')} м)`;
  applyTime();
}

// ---- Время суток: 7:00, 13:00, 19:00, 21:30 15 ноября (экран 6) ----
function sunDir(t) { const Hh = 15 * (t - 12) * rad, phi = LAT * rad, d = DECL * rad; const alt = Math.asin(Math.sin(phi) * Math.sin(d) + Math.cos(phi) * Math.cos(d) * Math.cos(Hh)); const az = Math.atan2(Math.sin(Hh), Math.cos(Hh) * Math.sin(phi) - Math.tan(d) * Math.cos(phi)); return { alt, v: new V3(-Math.sin(az) * Math.cos(alt), Math.sin(alt), Math.cos(az) * Math.cos(alt)) }; }
function applyTime() {
  const t = opt.time, night = t < 8 || t > 16.1;
  const presets = {
    7:    { ground: 0x5a5650, sky: [[0, '#1c2440'], [0.42, '#34406a'], [0.5, '#6b6a86'], [1, '#2a2e38']], fog: 0x3a4262, hemi: 0.12, glow: 1.2, lamp: 9, color: 0xf6f3ee, city: true },
    13:   { ground: 0xd9cfbf, sky: [[0, '#8fb3d6'], [0.45, '#cfe0ec'], [0.5, '#f3e6d6'], [1, '#b9bdb3']], fog: 0xdfe6ec, hemi: 1.5, glow: 0.05, lamp: 0, color: 0xffffff, city: false },
    15.75: { ground: 0xc9a684, sky: [[0, '#6f7fa6'], [0.35, '#d9a0a0'], [0.47, '#f3b98a'], [0.5, '#f7cf98'], [1, '#6e6258']], fog: 0xe8b993, hemi: 0.75, glow: 0.5, lamp: 4, color: 0xffd9a8, city: true },
    19:   { ground: 0x5a5046, sky: [[0, '#161b2e'], [0.45, '#2a3150'], [0.5, '#45405a'], [1, '#22252e']], fog: 0x2c3248, hemi: 0.1, glow: 1.1, lamp: 8, color: 0xffe6c4, city: true },
    21.5: { ground: 0x3a342e, sky: [[0, '#0f1322'], [0.45, '#1e2336'], [0.5, '#2c2a3a'], [1, '#1a1c22']], fog: 0x1e2234, hemi: 0.06, glow: 0.35, lamp: 2.5, color: 0xffd7a8, city: true },
  }[t];
  paintSky(presets.sky); scene.fog.color.set(presets.fog); hemi.intensity = presets.hemi; hemi.groundColor.set(presets.ground); // снизу — свет, отражённый от светлого пола: так светлеет потолок
  GLOW.emissive.set(presets.color); GLOW.emissiveIntensity = presets.glow; for (const l of interiorLights) { l.intensity = presets.lamp; l.color.set(presets.color); }
  CITYG.children.forEach(b => b.material = presets.city ? CITY.night : CITY.day);
  const s = sunDir(t); sun.intensity = night || s.alt <= 0 ? 0 : 3.2; sun.position.copy(W(room.sm, 0, room.yF).add(s.v.clone().multiplyScalar(150))); sun.target.position.copy(W(room.sm, -3, room.yF));
  document.querySelectorAll('[data-time]').forEach(b => b.classList.toggle('on', +b.dataset.time === t));
}

// ---- Виды ----
function setView(name) {
  const { s0, s1, yF, sm } = room; let pos, tgt;
  let sMax = sm, dMax = -1; for (let s = s0 + 0.5; s <= s1 - 0.5; s += 0.2) { const d = offsetAt(s, yF + 1.5); if (d > dMax) { dMax = d; sMax = s; } }
  if (name === 'back') { pos = W(s0 + 1.1, -APT + 0.6, yF + 1.6); tgt = W(s1 - 1.5, 1.5, yF + 1.3); } // из угла у входа в комнату
  if (name === 'window') { pos = W(s0 + 1.0, -1.6, yF + 1.6); tgt = W(s1 - 0.6, offsetAt(s1 - 0.6, yF + 1.4) - 0.3, yF + 1.35); } // вдоль ломаного стекла
  if (name === 'out') { pos = W(sm, -1.5, yF + 1.6); tgt = W(sm, 60, yF - 8); }
  if (name === 'hero') { pos = W(sm - 0.8, -APT + 0.35, yF + 1.35); tgt = W(sm - 0.8, 3, yF + 1.35); } // из глубины по оси, прямо на стекло
  if (name === 'corner2') { pos = W(s1 - 0.6, -APT + 0.6, yF + 1.6); tgt = W(s0 + 1.5, 1.5, yF + 1.3); }
  if (name === 'fromwindow') { pos = W(sm + 1.2, Math.min(offsetAt(sm + 1.2, yF), offsetAt(sm + 1.2, room.yC)) - 0.6, yF + 1.6); tgt = W(sm - 0.8, -APT, yF + 1.1); }
  if (name === 'seated') { pos = W(sm, opt.type === 'living' ? -4.7 : -APT + 1.6, yF + (opt.type === 'living' ? 1.1 : 1.2)); tgt = W(sm, 6, yF + 1.0); }
  if (name === 'plan') { pos = W(sm, -1, room.yC + 14); tgt = W(sm, -1, yF); }
  camera.fov = name === 'hero' ? 58 : 62; camera.updateProjectionMatrix(); // по оси — объектив чуть уже, меньше потолка
  lookAt(pos, tgt); document.getElementById('fov').value = camera.fov; document.getElementById('fovLabel').textContent = Math.round(camera.fov) + '°';
  house.children.forEach(c => { if (c.material === CEIL || c.material === GLOW) c.visible = name !== 'plan'; });
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === name));
  curView = name;
}
let curView = params.get('view') || 'back';

// ---- Управление ----
document.getElementById('hideUi').onclick = () => document.body.classList.add('clean');
addEventListener('keydown', e => { if ('hHрР'.includes(e.key)) document.body.classList.toggle('clean'); });
for (const k of ['floor', 'room', 'width']) { const el = document.getElementById(k); el.value = opt[k]; el.oninput = () => { opt[k] = +el.value; document.getElementById('room').max = MODS - opt.width; if (opt.room > MODS - opt.width) opt.room = MODS - opt.width; build(); setView(curView); }; }
document.getElementById('room').max = MODS - opt.width;
for (const k of ['furn', 'person']) { const el = document.getElementById(k); el.checked = opt[k]; el.onchange = () => { opt[k] = el.checked; build(); setView(curView); }; }
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
document.querySelectorAll('[data-type]').forEach(b => b.onclick = () => { opt.type = b.dataset.type; build(); setView(curView); });
document.querySelectorAll('[data-time]').forEach(b => b.onclick = () => { opt.time = +b.dataset.time; applyTime(); });
build(); setView(curView);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => { moveStep(); renderer.render(scene, camera); });
// объектив и ссылка на кадр
const fovEl = document.getElementById('fov'); fovEl.oninput = () => { camera.fov = +fovEl.value; camera.updateProjectionMatrix(); document.getElementById('fovLabel').textContent = fovEl.value + '°'; };
document.getElementById('copyCam').onclick = () => {
  const p = camera.position, q = new URLSearchParams({ type: opt.type, floor: opt.floor, room: opt.room, width: opt.width, t: opt.time, furn: opt.furn ? 1 : 0, cam: [p.x, p.y, p.z, look.yaw, look.pitch, camera.fov].map(v => v.toFixed(3)).join(',') });
  const url = location.origin + location.pathname + '?' + q.toString();
  navigator.clipboard?.writeText(url).then(() => { document.getElementById('copyCam').textContent = 'Ссылка скопирована'; setTimeout(() => document.getElementById('copyCam').textContent = 'Ссылка на этот кадр', 1500); }, () => prompt('Ссылка на кадр:', url));
};
if (params.get('cam')) { const [x, y, z, yw, pt, fv] = params.get('cam').split(',').map(Number); camera.position.set(x, y, z); look.yaw = yw; look.pitch = pt; camera.fov = fv; camera.updateProjectionMatrix(); applyLook(); fovEl.value = fv; document.getElementById('fovLabel').textContent = Math.round(fv) + '°'; }
</script>
